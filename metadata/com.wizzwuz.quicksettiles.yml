AutoName: QuickSetTiles
Summary: Custom Quick Settings tiles manager for Android
Description: |-
  A powerful Android Quick Settings tile creator and manager built with
  Jetpack Compose and Material 3.

  Features:
  * 8 Tile Types: Apps, Web links, Shortcuts, Activities (including Private activities via Shizuku/Root), Intents, Shell scripts, Files, and Folders
  * Split Apps: Launch app pairs in split-screen mode directly from QS
  * Dynamic grid layout and classic card list view
  * Privacy-focused: 100% offline, zero trackers, open source under GNU GPLv3

