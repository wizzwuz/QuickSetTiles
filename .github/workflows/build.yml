name: Build QuickSetTiles APK

on:
  push:
    branches: [ "main", "master", "experiments", "experimentals*", "tile-redesign*", "tab-redesign*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "experiments", "experimentals*", "tile-redesign*", "tab-redesign*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.build_type }} APK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            task: assembleRelease
            artifact_name: QuickSetTiles-release-apk
            artifact_path: app/build/outputs/apk/release/*.apk
          - build_type: Debug
            task: assembleDebug
            artifact_name: QuickSetTiles-debug-apk
            artifact_path: app/build/outputs/apk/debug/*.apk

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Java 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Ensure Release Keystore
      run: |
        mkdir -p keystore
        if [ ! -f keystore/release.jks ]; then
          echo "Generating release keystore..."
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -alias quicksettiles \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "quicksettiles_keystore_pass" \
            -keypass "quicksettiles_keystore_pass" \
            -dname "CN=QuickSetTiles, OU=Mobile, O=QuickSetTiles, L=World, ST=Global, C=US"
          echo "Generated new RSA 2048-bit release keystore for APK signing."
        else
          echo "Release keystore present."
          echo "Using existing release keystore for APK signing."
        fi

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Generate App Launcher Icons from icon.png
      run: |
        python3 -m pip install pillow
        python3 -c "
        import os
        from PIL import Image

        icon_path = 'icon.png'
        if not os.path.exists(icon_path):
            print('icon.png not found; default mipmap icons will be used.')
            exit(0)

        img = Image.open(icon_path).convert('RGBA')

        densities = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192,
        }

        for folder, size in densities.items():
            out_dir = os.path.join('app/src/main/res', folder)
            os.makedirs(out_dir, exist_ok=True)
            resized = img.resize((size, size), Image.Resampling.LANCZOS)
            resized.save(os.path.join(out_dir, 'ic_launcher.png'))
            resized.save(os.path.join(out_dir, 'ic_launcher_round.png'))
            print(f'Generated {folder} ({size}x{size})')

        fg_canvas = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
        safe_icon = img.resize((312, 312), Image.Resampling.LANCZOS)
        offset = ((432 - 312) // 2, (432 - 312) // 2)
        fg_canvas.paste(safe_icon, offset, safe_icon)

        os.makedirs('app/src/main/res/drawable', exist_ok=True)
        xml_fg = 'app/src/main/res/drawable/ic_launcher_foreground.xml'
        if os.path.exists(xml_fg):
            os.remove(xml_fg)
        fg_canvas.save('app/src/main/res/drawable/ic_launcher_foreground.png')
        print('Generated ic_launcher_foreground.png (432x432)')
        print('Successfully generated adaptive foreground (432x432) and mipmap launcher icons (mdpi-xxxhdpi) from icon.png.')
        "

    - name: Build APK
      run: ./gradlew ${{ matrix.task }} -x test --parallel --build-cache

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
        retention-days: 14

    - name: Add Build Summary
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          APK_FILE=$(ls ${{ matrix.artifact_path }} 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            APK_NAME=$(basename "$APK_FILE")
            APK_SIZE_BYTES=$(wc -c < "$APK_FILE" | tr -d ' ')
            APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $APK_SIZE_BYTES / 1048576}")
            
            echo "QuickSetTiles ${{ matrix.build_type }} APK generated: $APK_NAME ($APK_SIZE_MB MB). Artifact: ${{ matrix.artifact_name }}"
            
            echo "### Build Complete! 🚀" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| **Build Type** | \`${{ matrix.build_type }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Package Name** | \`com.wizzwuz.quicksettiles\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Version** | \`1.0.0\` (code \`1\`) |" >> $GITHUB_STEP_SUMMARY
            echo "| **APK File** | \`$APK_NAME\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **APK Size** | \`$APK_SIZE_MB MB\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Artifact Name** | \`${{ matrix.artifact_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> The APK is signed with the release keystore and supports Android 7.0+ (API 24 to 35)." >> $GITHUB_STEP_SUMMARY
          else
            echo "Artifact Missing (${{ matrix.build_type }}): APK file was not found at ${{ matrix.artifact_path }}"
          fi
        else
          echo "Build Failure (${{ matrix.build_type }}): QuickSetTiles ${{ matrix.build_type }} build failed. Check step logs for details."
        fi

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Release APK
        uses: actions/download-artifact@v7
        with:
          name: QuickSetTiles-release-apk
          path: release-apk

      - name: Download Debug APK
        uses: actions/download-artifact@v7
        with:
          name: QuickSetTiles-debug-apk
          path: debug-apk

      - name: Prepare Release Assets & PGP Signature
        run: |
          mkdir -p dist

          # Copy release APK to canonical release name
          REL_APK=$(find release-apk -name "*.apk" | head -n 1)
          if [ -n "$REL_APK" ] && [ -f "$REL_APK" ]; then
            cp "$REL_APK" dist/QuickSetTiles-1.0.0.apk
          else
            echo "Error: Release APK not found!"
            exit 1
          fi

          # Copy debug APK if present
          DBG_APK=$(find debug-apk -name "*.apk" | head -n 1)
          if [ -n "$DBG_APK" ] && [ -f "$DBG_APK" ]; then
            cp "$DBG_APK" dist/QuickSetTiles-1.0.0-debug.apk
          fi

          # Generate GPG Key for PGP Signing (.asc)
          cat <<EOF > gpg-gen-key.conf
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Subkey-Type: RSA
          Subkey-Length: 4096
          Name-Real: QuickSetTiles Signer
          Name-Email: release@quicksettiles.wizzwuz.com
          Expire-Date: 0
          EOF
          gpg --batch --generate-key gpg-gen-key.conf
          rm -f gpg-gen-key.conf

          # Create detached ASCII-armored PGP signature (.asc) for the APK
          gpg --armor --detach-sign --output dist/QuickSetTiles-1.0.0.apk.asc dist/QuickSetTiles-1.0.0.apk

          # Export public key for verification
          gpg --armor --export release@quicksettiles.wizzwuz.com > dist/QuickSetTiles-public-key.asc

          # Verify signature
          gpg --verify dist/QuickSetTiles-1.0.0.apk.asc dist/QuickSetTiles-1.0.0.apk

          # Generate SHA256 checksums
          (cd dist && sha256sum * > SHA256SUMS.txt)

          echo "Prepared release assets:"
          ls -la dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi

          gh release create "$TAG_NAME" dist/* \
            --title "QuickSetTiles $TAG_NAME" \
            --notes-file - << 'EOF'
          ## QuickSetTiles v1.0.0 — Official First Stable Release 🎉

          A powerful, modern Android Quick Settings tile creator and manager built with Jetpack Compose & Material 3.

          ### 📦 Release Assets
          - **QuickSetTiles-1.0.0.apk**: Official signed release APK (optimized with ProGuard/R8)
          - **QuickSetTiles-1.0.0.apk.asc**: Detached ASCII-armored PGP signature (.asc)
          - **QuickSetTiles-public-key.asc**: Public PGP signing key for verifying authenticity
          - **QuickSetTiles-1.0.0-debug.apk**: Debug build with log exporter
          - **SHA256SUMS.txt**: SHA256 verification checksums
          - **Source code (.zip & .tar.gz)**: Full project source code (attached automatically by GitHub)

          ### ✨ Key Features
          - **8 Tile Types**: Apps, Web links, Shortcuts, Activities (including Private/unexported activities via Shizuku/Root), Intents, Shell scripts, Files, and Folders.
          - **Tile Grid & Classic Card Views**: Responsive dynamic grid arrangement or customizable rows/columns with circular QS preview icons.
          - **Inbuilt Shizuku & Root Support**: Zero external plugin required to launch private system activities.
          - **57,000+ Icons & Full Customization**: Material Symbols with threshold, thickness, and sizing controls.
          - **Backup & Restore**: Full JSON backup and restore including tiles, custom icons, theme, and grid arrangement.
          - **Privacy & Security**: 100% offline, zero trackers, open source under GNU GPLv3.

          ### 🔐 PGP Signature Verification
          To verify the authenticity of the release APK:
          ```bash
          # 1. Import the public key
          gpg --import QuickSetTiles-public-key.asc

          # 2. Verify the release APK signature
          gpg --verify QuickSetTiles-1.0.0.apk.asc QuickSetTiles-1.0.0.apk
          ```
          EOF
