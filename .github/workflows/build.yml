name: Build QuickSetTiles APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.build_type }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            task: assembleRelease
            artifact_name: QuickSetTiles-release-apk
            artifact_path: app/build/outputs/apk/release/*.apk
          - build_type: Debug
            task: assembleDebug
            artifact_name: QuickSetTiles-debug-apk
            artifact_path: app/build/outputs/apk/debug/*.apk

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: false

    - name: Ensure Release Keystore
      run: |
        mkdir -p keystore
        if [ ! -f keystore/release.jks ]; then
          echo "Generating release keystore..."
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -alias quicksettiles \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "quicksettiles_keystore_pass" \
            -keypass "quicksettiles_keystore_pass" \
            -dname "CN=QuickSetTiles, OU=Mobile, O=QuickSetTiles, L=World, ST=Global, C=US"
        else
          echo "Release keystore present."
        fi

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Generate App Launcher Icons from icon.png
      run: |
        python3 -m pip install pillow
        python3 -c "
        import os
        from PIL import Image

        icon_path = 'icon.png'
        if not os.path.exists(icon_path):
            print('icon.png not found, skipping icon generation')
            exit(0)

        img = Image.open(icon_path).convert('RGBA')

        densities = {
            'mipmap-mdpi': 48,
            'mipmap-hdpi': 72,
            'mipmap-xhdpi': 96,
            'mipmap-xxhdpi': 144,
            'mipmap-xxxhdpi': 192,
        }

        for folder, size in densities.items():
            out_dir = os.path.join('app/src/main/res', folder)
            os.makedirs(out_dir, exist_ok=True)
            resized = img.resize((size, size), Image.Resampling.LANCZOS)
            resized.save(os.path.join(out_dir, 'ic_launcher.png'))
            resized.save(os.path.join(out_dir, 'ic_launcher_round.png'))
            print(f'Generated {folder} ({size}x{size})')

        fg_canvas = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
        safe_icon = img.resize((312, 312), Image.Resampling.LANCZOS)
        offset = ((432 - 312) // 2, (432 - 312) // 2)
        fg_canvas.paste(safe_icon, offset, safe_icon)

        os.makedirs('app/src/main/res/drawable', exist_ok=True)
        xml_fg = 'app/src/main/res/drawable/ic_launcher_foreground.xml'
        if os.path.exists(xml_fg):
            os.remove(xml_fg)
        fg_canvas.save('app/src/main/res/drawable/ic_launcher_foreground.png')
        print('Generated ic_launcher_foreground.png (432x432)')
        "

    - name: Build APK
      run: ./gradlew ${{ matrix.task }} -x test --parallel --build-cache

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
        retention-days: 14

    - name: Add Build Summary
      run: |
        echo "### Build Complete! 🚀" >> $GITHUB_STEP_SUMMARY
        echo "The **QuickSetTiles** ${{ matrix.build_type }} APK was compiled and signed with the release keystore." >> $GITHUB_STEP_SUMMARY
        echo "- **Artifact:** \`${{ matrix.artifact_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Built on commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
